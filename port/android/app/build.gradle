plugins {
    id "com.android.application"
}

// build/android in the repository root, where `ninja android` stages the
// native libraries (jniLibs) and the guest image (assets)
def staged = new File(rootDir, "../../build/android")

// a release's build knows its number (tools/ci_build.py, from the tag), which names its
// release and which the self-updater (Updater.java) compares; others have
// none and never look for updates
def buildNumberText = System.getenv("HALO_BUILD_NUMBER") ?: "0"
def buildNumber = buildNumberText.isInteger() ? buildNumberText.toInteger() : 0

// the workflow's signing key (.github/workflows/build.yml): every build of
// main signed with it can install over the one before; without it, the
// debug key of the computer that builds
def signingKey = System.getenv("HALO_ANDROID_KEYSTORE")

// the game's package name, and the one it had: a package name cannot change in an update, so the old one's last
// builds are a bridge (HALO_ANDROID_BRIDGE=1: Migration.java), each release's halo-android-release.zip, which every
// installed build's updater asks for, and which brings the player's data to the new one
def newPackage = "ar.com.slipstreamce"
def oldPackage = "com.halo.decomp"
def bridge = System.getenv("HALO_ANDROID_BRIDGE") == "1"

android {
    namespace "com.halo.decomp"
    compileSdk 35

    defaultConfig {
        // HALO_APPLICATION_ID_SUFFIX (for example ".vk") installs a build beside the one from
        // GitHub Actions, which another signing key stops it from replacing, with data of its own
        // (port/android/VULKAN.md)
        applicationId((bridge ? oldPackage : newPackage) + (System.getenv("HALO_APPLICATION_ID_SUFFIX") ?: ""))
        minSdk 28
        targetSdk 35
        versionCode Math.max(1, buildNumber)
        versionName buildNumber > 0 ? "build " + buildNumber : "1.0"
        buildConfigField "int", "HALO_BUILD_NUMBER", "${buildNumber}"
        buildConfigField "boolean", "HALO_BRIDGE", "${bridge}"
        buildConfigField "String", "HALO_NEW_PACKAGE", "\"${newPackage}\""
        buildConfigField "String", "HALO_OLD_PACKAGE", "\"${oldPackage}\""
        manifestPlaceholders = [migrationProvider: bridge ? "true" : "false"]
        // (the bridge keeps the name its players know it by, and Migration.java's "your old Halo app" names)
        resValue "string", "app_name", bridge ? "Halo" : "SlipstreamCE"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    sourceSets {
        main {
            java.srcDirs += new File(staged, "third_party/SDL3/android-project/app/src/main/java")
            // (the bridge has no game: BridgeActivity is all it runs)
            jniLibs.srcDirs = bridge ? [] : [new File(staged, "jniLibs")]
            assets.srcDirs = bridge ? [] : [new File(staged, "assets")]
            // the launcher icon: the bridge keeps upstream's (tools/app_icon.py), the new app has its logo
            // (tools/slipstream_icon.py)
            res.srcDirs += bridge ? "src/bridge/res" : "src/slipstreamce/res"
        }
    }

    // the guest image is read straight from the APK
    androidResources {
        noCompress += ["elf"]
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildFeatures {
        buildConfig true
        resValues true
    }

    signingConfigs {
        if (signingKey) {
            halo {
                storeFile file(signingKey)
                storePassword System.getenv("HALO_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("HALO_ANDROID_KEY_ALIAS") ?: "halo"
                keyPassword System.getenv("HALO_ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingKey ? signingConfigs.halo : signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingKey ? signingConfigs.halo : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
