<svg id="game-types-setup-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 350" class="w-full h-full">

                            <!-- 1. MAIN CHASSIS / BACKGROUND PANEL BASE (SQUARE 300x300) -->
                            <rect x="25" y="25" width="300" height="300" rx="28" fill="#274261" stroke="#101c2b" stroke-width="2"></rect>
                            <rect x="38" y="38" width="274" height="274" rx="20" fill="none" stroke="#1a2d44" stroke-width="1.5"></rect>

                            <!-- 2. DATA SLATE / CHECKLIST BOARD -->
                            <rect x="60" y="52" width="230" height="246" rx="14" fill="#15273d" stroke="#101c2b" stroke-width="1.5"></rect>
                            <rect x="68" y="60" width="214" height="230" rx="10" fill="#1a2d44" stroke="#254366" stroke-width="1"></rect>
                            
                            <!-- Slate Header Tab Clip -->
                            <rect x="140" y="48" width="70" height="9" rx="3" fill="#203a58" stroke="#101c2b" stroke-width="1"></rect>
                            <circle cx="175" cy="52.5" r="1.5" fill="#9bbbd4" opacity="0.8"></circle>

                            <!-- 3. RULE CATEGORIES & TOGGLES (4 ROW LAYOUT WITH SLATE PANELS) -->
                            
                            <!-- ITEM 1: CTF FLAG -->
                            <g transform="translate(76, 68)">
                                <rect x="0" y="0" width="198" height="48" rx="6" fill="#15273d" stroke="#234266" stroke-width="1"></rect>
                                
                                <!-- Flag Icon Group -->
                                <g transform="translate(14, 8)">
                                    <line x1="12" y1="8" x2="12" y2="25" stroke="#9bbbd4" stroke-width="1.8" stroke-linecap="round"></line>
                                    <polygon points="12,8 24,13 12,18" fill="#15273d" stroke="#9bbbd4" stroke-width="1.2" stroke-linejoin="round"></polygon>
                                </g>
                                
                                <!-- Connection Line -->
                                <line x1="55" y1="24" x2="135" y2="24" stroke="#2e4e75" stroke-width="1" stroke-dasharray="3,3"></line>

                                <!-- Toggle ON -->
                                <g transform="translate(144, 15)">
                                    <rect x="0" y="0" width="38" height="18" rx="9" fill="#1a2d44" stroke="#9bbbd4" stroke-width="1.5"></rect>
                                    <circle cx="29" cy="9" r="6" fill="#9bbbd4"></circle>
                                </g>
                            </g>

                            <!-- ITEM 2: TIMER / ODDBALL -->
                            <g transform="translate(76, 122)">
                                <rect x="0" y="0" width="198" height="48" rx="6" fill="#15273d" stroke="#234266" stroke-width="1"></rect>
                                
                                <!-- Stopwatch / Timer Icon Group -->
                                <g transform="translate(14, 8)">
                                    <circle cx="16" cy="17" r="8.5" fill="none" stroke="#9bbbd4" stroke-width="1.2"></circle>
                                    <line x1="16" y1="5.5" x2="16" y2="7.5" stroke="#9bbbd4" stroke-width="1.8" stroke-linecap="round"></line>
                                    <line x1="16" y1="17" x2="16" y2="12" stroke="#9bbbd4" stroke-width="1.2" stroke-linecap="round"></line>
                                    <line x1="16" y1="17" x2="20" y2="17" stroke="#9bbbd4" stroke-width="1.2" stroke-linecap="round"></line>
                                </g>
                                
                                <!-- Connection Line -->
                                <line x1="55" y1="24" x2="135" y2="24" stroke="#2e4e75" stroke-width="1" stroke-dasharray="3,3"></line>

                                <!-- Toggle OFF -->
                                <g transform="translate(144, 15)">
                                    <rect x="0" y="0" width="38" height="18" rx="9" fill="#101c2b" stroke="#35577d" stroke-width="1.5"></rect>
                                    <circle cx="9" cy="9" r="6" fill="#35577d"></circle>
                                </g>
                            </g>

                            <!-- ITEM 3: SLAYER CROSSHAIR -->
                            <g transform="translate(76, 176)">
                                <rect x="0" y="0" width="198" height="48" rx="6" fill="#15273d" stroke="#234266" stroke-width="1"></rect>
                                
                                <!-- Crosshair Icon Group -->
                                <g transform="translate(14, 8)">
                                    <circle cx="16" cy="16" r="8" fill="none" stroke="#9bbbd4" stroke-width="1.2"></circle>
                                    <line x1="4" y1="16" x2="9" y2="16" stroke="#9bbbd4" stroke-width="1.2"></line>
                                    <line x1="23" y1="16" x2="28" y2="16" stroke="#9bbbd4" stroke-width="1.2"></line>
                                    <line x1="16" y1="4" x2="16" y2="9" stroke="#9bbbd4" stroke-width="1.2"></line>
                                    <line x1="16" y1="23" x2="16" y2="28" stroke="#9bbbd4" stroke-width="1.2"></line>
                                    <circle cx="16" cy="16" r="1.5" fill="#9bbbd4"></circle>
                                </g>
                                
                                <!-- Connection Line -->
                                <line x1="55" y1="24" x2="135" y2="24" stroke="#2e4e75" stroke-width="1" stroke-dasharray="3,3"></line>

                                <!-- Toggle ON -->
                                <g transform="translate(144, 15)">
                                    <rect x="0" y="0" width="38" height="18" rx="9" fill="#1a2d44" stroke="#9bbbd4" stroke-width="1.5"></rect>
                                    <circle cx="29" cy="9" r="6" fill="#9bbbd4"></circle>
                                </g>
                            </g>

                            <!-- ITEM 4: ODDBALL SKULL -->
                            <g transform="translate(76, 230)">
                                <rect x="0" y="0" width="198" height="48" rx="6" fill="#15273d" stroke="#234266" stroke-width="1"></rect>
                                
                                <!-- Skull Icon Group -->
                                <g transform="translate(14, 8)">
                                    <path d="M 8 9 C 8 2 24 2 24 9 C 24 16 21 21 21 24 L 11 24 C 11 21 8 16 8 9 Z" fill="none" stroke="#9bbbd4" stroke-width="1.2"></path>
                                    <rect x="13" y="24" width="6" height="5" fill="none" stroke="#9bbbd4" stroke-width="1" rx="0.5"></rect>
                                    <line x1="15" y1="24" x2="15" y2="29" stroke="#9bbbd4" stroke-width="0.8"></line>
                                    <line x1="17" y1="24" x2="17" y2="29" stroke="#9bbbd4" stroke-width="0.8"></line>
                                    <rect x="11" y="10" width="3" height="3" fill="#9bbbd4" rx="0.5"></rect>
                                    <rect x="18" y="10" width="3" height="3" fill="#9bbbd4" rx="0.5"></rect>
                                    <polygon points="16,15 17.5,17 14.5,17" fill="#9bbbd4"></polygon>
                                </g>
                                
                                <!-- Connection Line -->
                                <line x1="55" y1="24" x2="135" y2="24" stroke="#2e4e75" stroke-width="1" stroke-dasharray="3,3"></line>

                                <!-- Toggle OFF -->
                                <g transform="translate(144, 15)">
                                    <rect x="0" y="0" width="38" height="18" rx="9" fill="#101c2b" stroke="#35577d" stroke-width="1.5"></rect>
                                    <circle cx="9" cy="9" r="6" fill="#35577d"></circle>
                                </g>
                            </g>

                        <!-- PURE 2D VECTOR GAME TYPES HUD SVG -->
                        </svg>