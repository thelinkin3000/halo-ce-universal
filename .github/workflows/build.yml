name: Build

# Debug and release builds of the native ports (Linux, Windows, Android) for
# every pushed commit, uploaded as artifacts. tools/ci_build.py does each
# build; see it for the options. This fork builds Android, the Switch and the
# PS5 only: the Linux and Windows jobs are kept, upstream's, but do not run
# (if: false), and the release and the notice go without them.
#
# Kept cheap:
# - one job per platform builds both configurations, so its set-up (tools,
#   downloads, caches) is paid once;
# - compiles go through ccache, whose cache carries over from run to run, so
#   a commit only recompiles what it changed; downloads (SDL, musl, Gradle,
#   the Linux build's system root) are cached too;
# - a newer push to the same branch cancels a run still going;
# - pushes that only change documentation do not build;
# - Windows, whose minutes cost twice Linux's, builds only Windows;
# - artifacts are kept for three days.
#
# A release is made by pushing a tag v<number> (git tag v94 && git push
# origin v94) to a commit of main: the builds of that commit are published as
# the GitHub release build-<number>, "Build <number>" (or the commit's subject,
# "Build <number>: <title>", for a release with a title), its notes the
# commit's message, marked latest, so that
# https://github.com/<repository>/releases/latest/download/<file> always
# gives the latest build; the last five are kept. The release is named
# build-<number>, not v<number>, because that is what the builds already
# installed look for (their updaters: port/switch/host/host_update.c,
# port/ps5/host/host_update_ps5.c, port/linux/src/updater.c, the Android
# app's Updater.java), and the number
# has to be higher than the last release's, which they compare it with (and
# Android's version code is). Pushes to other branches build without a
# release; a push to main builds nothing, as its commits are built by their
# tag's run (two runs at once, the branch's and the tag's, otherwise), or
# by hand (workflow_dispatch).
# Its web build is then the site on GitHub Pages
# (https://halocombatevolved.com/, port/web/README.md).
on:
  push:
    branches:
      - "**"
      # (built by its tags: see the top)
      - "!main"
    tags:
      - "v*"
    # (not checked for a tag's push, which always builds)
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      profile:
        description: "Also build the profiling flavour (configure.py --profile) on Linux"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 1G

jobs:
  linux:
    # Arch Linux has what the build needs as packages: clang 22 (for the
    # profile-guided optimisation in pgo/), and CMake, pkg-config and
    # wayland-scanner for the SDL 3 that the portable build brings. The build
    # links against Debian 11's 32-bit glibc (tools/linux_sysroot.py), not
    # Arch's, so that it starts on SteamOS and older distributions; Arch's
    # 32-bit glibc is for the tests.
    # (not built by this fork: see the top)
    if: false
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 40
    steps:
      - name: Install the toolchain
        run: |
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm --needed git zstd python python-pytest python-pillow python-numpy python-scipy ninja ccache \
            clang lld gcc lib32-glibc lib32-gcc-libs cmake pkgconf wayland

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      # the system root and SDL's source, which the build downloads
      - uses: actions/cache@v4
        with:
          path: build/linux/third_party
          key: linux-third-party-${{ hashFiles('tools/linux_sysroot.py') }}

      - name: Debug
        run: python tools/ci_build.py linux debug

      # (the profiling build, configure.py --profile, which no other step
      # compiles: only when a run started by hand asks for it, as it costs a
      # build of its own)
      - name: Profile
        if: github.event_name == 'workflow_dispatch' && inputs.profile
        run: python tools/ci_build.py linux profile

      - name: Release
        run: python tools/ci_build.py linux release

      - name: Test
        run: |
          python -m pytest -q tools/test_linux_port.py tools/test_android_asm_convert.py tools/test_android_mirror_uploads.py tools/test_android_static_geometry.py tools/test_android_render_policy.py tools/test_android_ce_texture_cache.py tools/test_host_watch_hash.py tools/test_host_units.py tools/test_check_host_imports.py tools/test_host_syscall.py tools/test_touch_menu.py tools/harness tools/test_profile.py tools/stagekit/tests tools/test_net_compare.py tools/test_server_sim.py tools/test_egg.py tools/test_deploy_gametypes.py
          # the dedicated server: --version, and --server without maps refused (exit code 2); its cases with
          # clients need the retail maps, and are skipped
          python -m pytest -q tools/test_dedicated_server.py
          python tools/test_light_storage.py
          python -m pytest -q tools/test_controller_buttons.py tools/test_controller_remap.py tools/test_hud_button_style.py tools/test_hud_corrections.py

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: halo-linux-debug
          path: dist/halo-linux-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: halo-linux-release
          path: dist/halo-linux-release
          retention-days: 3

  linux-arm64:
    # Ubuntu 22.04 (glibc 2.35, so the build starts on older distributions
    # too) on GitHub's 64-bit ARM runner, with clang 22 from apt.llvm.org (the
    # guest's arm64_32 target) and the development files SDL3 builds with.
    # (not built by this fork: see the top)
    if: false
    runs-on: ubuntu-24.04-arm
    container: ubuntu:22.04
    timeout-minutes: 40
    steps:
      - name: Install the toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg lsb-release \
            software-properties-common git python3 ninja-build cmake make pkg-config ccache zip \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev \
            libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl-dev libgles-dev \
            libgl-dev libdrm-dev libgbm-dev libpulse-dev libpipewire-0.3-dev libasound2-dev \
            libudev-dev libdbus-1-dev libdecor-0-dev
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          bash llvm.sh 22 && rm llvm.sh
          apt-get install -y --no-install-recommends lld-22 llvm-22
          for tool in clang ld.lld llvm-ar llvm-objdump; do ln -sf "/usr/bin/$tool-22" "/usr/local/bin/$tool"; done

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-arm64-${{ github.sha }}
          restore-keys: ccache-linux-arm64-

      # musl and SDL, which configure.py fetches
      - uses: actions/cache@v4
        with:
          path: build/linux_arm64/third_party
          key: linux-arm64-third-party-${{ hashFiles('tools/android_build.py', 'port/android/patches/**') }}

      - name: Debug
        run: python3 tools/ci_build.py linux_arm64 debug

      - name: Release
        run: python3 tools/ci_build.py linux_arm64 release

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: halo-linux-arm64-debug
          path: dist/halo-linux-arm64-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: halo-linux-arm64-release
          path: dist/halo-linux-arm64-release
          retention-days: 3

  linux-x86_64:
    # The 64-bit x86 guest build (ninja linux_x86_64: the game as x32 code in
    # a 64-bit host), made as the 64-bit ARM one is: Ubuntu 22.04 (glibc 2.35,
    # so the build starts on older distributions too) with clang 22 from
    # apt.llvm.org (the guest's x32 target) and the development files SDL3
    # builds with; and the tests of the guest's call boundary and image
    # checks, which need this processor.
    # (not built by this fork: see the top)
    if: false
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 40
    steps:
      - name: Install the toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg lsb-release \
            software-properties-common git python3 python3-pytest ninja-build cmake make pkg-config ccache zip \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev \
            libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl-dev libgles-dev \
            libgl-dev libdrm-dev libgbm-dev libpulse-dev libpipewire-0.3-dev libasound2-dev \
            libudev-dev libdbus-1-dev libdecor-0-dev
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          bash llvm.sh 22 && rm llvm.sh
          apt-get install -y --no-install-recommends lld-22 llvm-22
          for tool in clang ld.lld llvm-ar llvm-objdump llvm-objcopy llvm-nm; do
            ln -sf "/usr/bin/$tool-22" "/usr/local/bin/$tool"
          done

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-x86_64-${{ github.sha }}
          restore-keys: ccache-linux-x86_64-

      # musl and SDL, which configure.py fetches
      - uses: actions/cache@v4
        with:
          path: build/linux_x86_64/third_party
          key: linux-x86_64-third-party-${{ hashFiles('tools/android_build.py', 'port/android/patches/**') }}

      - name: Debug
        run: python3 tools/ci_build.py linux_x86_64 debug

      - name: Release
        run: python3 tools/ci_build.py linux_x86_64 release

      - name: Test
        run: python3 -m pytest -q tools/test_host_units.py tools/test_guest_image_check.py tools/test_check_host_imports.py tools/test_host_syscall.py tools/test_guest_layout.py tools/test_linux_guest_build.py tools/test_shader_keys.py

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: halo-linux-x86_64-debug
          path: dist/halo-linux-x86_64-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: halo-linux-x86_64-release
          path: dist/halo-linux-x86_64-release
          retention-days: 3

  android:
    # The runner image has the Android SDK and NDK, a JDK and CMake.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install the toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          # (each download checked against the hash it had when it was pinned)
          curl -fsSL -o ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip
          curl -fsSL -o ccache.tar.xz https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz
          sha256sum -c - <<'EOF'
          6f98805688d19672bd699fbbfa2c2cf0fc054ac3df1f0e6a47664d963d530255  ninja.zip
          80cab87bd510eca796467aee8e663c398239e0df1c4800a0b5dff11dca0b4f18  ccache.tar.xz
          EOF
          unzip -q ninja.zip -d "$RUNNER_TEMP/tools" && rm ninja.zip
          tar -xJf ccache.tar.xz -C "$RUNNER_TEMP/tools" --strip-components=1 ccache-4.10.2-linux-x86_64/ccache && rm ccache.tar.xz
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-android-${{ github.sha }}
          restore-keys: ccache-android-

      # musl and SDL, which configure.py fetches
      - uses: actions/cache@v4
        with:
          path: build/android/third_party
          key: android-third-party-${{ hashFiles('tools/android_build.py', 'port/android/patches/**') }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('port/android/**/*.gradle*', 'port/android/gradle/wrapper/gradle-wrapper.properties') }}

      # the app's signing key, from the ANDROID_KEYSTORE_BASE64 secret (a
      # keystore, base64) and ANDROID_KEYSTORE_PASSWORD (its password, and
      # the key's, alias halo): every build signed with it installs over the
      # one before, as the app's self-updater (Updater.java) needs. Without
      # them each build is signed with the runner's own debug key.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/halo.keystore"
            echo "HALO_ANDROID_KEYSTORE=$RUNNER_TEMP/halo.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret: the Android builds cannot update over each other"
          fi

      - name: Debug
        env:
          HALO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python3 tools/ci_build.py android debug

      - name: Release
        env:
          HALO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python3 tools/ci_build.py android release

      # the touch controls' layout and gyroscope maths (the runner's JDK)
      - name: Test the touch layout
        run: python3 tools/test_touch_layout.py

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: halo-android-debug
          path: dist/halo-android-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: halo-android-release
          path: dist/halo-android-release
          retention-days: 3

  windows:
    # The runner image has LLVM, Python and Visual Studio's x86 libraries and
    # Windows SDK.
    # (not built by this fork: see the top)
    if: false
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the toolchain
        shell: pwsh
        run: |
          Invoke-WebRequest -OutFile ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip
          Invoke-WebRequest -OutFile ccache.zip https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-windows-x86_64.zip
          # (each download checked against the hash it had when it was pinned)
          if ((Get-FileHash ninja.zip -Algorithm SHA256).Hash -ne "F550FEC705B6D6FF58F2DB3C374C2277A37691678D6ABA463ADCBB129108467A") { throw "ninja.zip: unexpected SHA-256" }
          if ((Get-FileHash ccache.zip -Algorithm SHA256).Hash -ne "6252F081876A9A9F700FAE13A5AEC5D0D486B28261D7F1F72AC11C7AD9DF4DA9") { throw "ccache.zip: unexpected SHA-256" }
          Expand-Archive ninja.zip -DestinationPath "$env:RUNNER_TEMP\tools"
          Expand-Archive ccache.zip -DestinationPath $env:RUNNER_TEMP
          Copy-Item "$env:RUNNER_TEMP\ccache-4.10.2-windows-x86_64\ccache.exe" "$env:RUNNER_TEMP\tools"
          Remove-Item ninja.zip, ccache.zip
          "$env:RUNNER_TEMP\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-

      # SDL's development package, which configure.py fetches
      - uses: actions/cache@v4
        with:
          path: build/windows/third_party
          key: windows-third-party-${{ hashFiles('tools/windows_build.py') }}

      - name: Debug
        run: python tools/ci_build.py windows debug

      - name: Release
        run: python tools/ci_build.py windows release

      - name: Test light storage
        run: python tools/test_light_storage.py

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: halo-windows-debug
          path: dist/halo-windows-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: halo-windows-release
          path: dist/halo-windows-release
          retention-days: 3

      # the PDBs, for crash reports' backtraces (tools/ci_build.py)
      - uses: actions/upload-artifact@v4
        with:
          name: halo-windows-debug-symbols
          path: dist/halo-windows-debug-symbols
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: halo-windows-release-symbols
          path: dist/halo-windows-release-symbols
          retention-days: 3

  switch:
    # Two toolchains and neither can be replaced by the other: devkitA64 builds
    # the host, and the Android NDK builds the guest, which is ILP32 AArch64
    # (32-bit pointers, because the Xbox data formats embed them) and so
    # cannot be built by devkitA64 at all.
    #
    # It runs in devkitPro's own image. Their package hosts
    # (apt.devkitpro.org, pkg.devkitpro.org) answer 403 to a GitHub runner and
    # to a plain curl - everything, the repository's root included - so
    # installing devkitPro, or its SDL2 and Mesa, from them does not work here.
    # The image carries the toolchain; the Android NDK comes from Google, which
    # does answer.
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    timeout-minutes: 60
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
    steps:
      # Prove the image has what the host links against, and say which is
      # missing if it does not. Better a clear message now than a link error
      # two steps later that reads like a build problem.
      - name: Check the toolchain
        run: |
          echo "--- /opt/devkitpro ---"
          ls /opt/devkitpro
          echo "--- portlibs/switch/lib ---"
          ls /opt/devkitpro/portlibs/switch/lib 2>&1 | head -20 || true
          for library in libSDL2 libGLESv2 libEGL; do
            if [ -f "/opt/devkitpro/portlibs/switch/lib/$library.a" ]; then
              echo "found $library"
            else
              echo "::error::$library is not in the image; the host will not link without it"
            fi
          done
          if [ -f /opt/devkitpro/libnx/lib/libdeko3d.a ]; then
            echo "found libdeko3d"
          else
            echo "::error::libdeko3d is not in the image; the host will not link without it"
          fi

      # The guest needs the NDK, which the image does not carry and the
      # runner's own SDK is not visible from inside a container. Android
      # publishes the whole NDK as one archive, so it is fetched and pointed
      # at with ANDROID_NDK_HOME, which is what configure.py reads.
      - name: Install the Android NDK
        run: |
          curl -fsSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q ndk.zip -d /opt
          rm ndk.zip
          # ANDROID_NDK_HOME only. Its bin directory is deliberately *not* on
          # PATH: musl is compiled by clang, and the NDK's clang 17 does not
          # know -fno-define-target-os-macros, which musl's Apple-target
          # configuration passes. The runner's own clang (18) does. The build
          # calls the NDK's llvm-ar and ld.lld by path, so nothing needs it
          # on PATH.
          echo "ANDROID_NDK_HOME=/opt/android-ndk-r26d" >> "$GITHUB_ENV"

      - name: Install the build tools
        run: |
          # The guest is compiled for arm64_32, which only recent clang knows
          # well; Debian's clang 14 emits indirect branches the ELF assembler
          # will not take, so LLVM's own builds are used instead.
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/bookworm/ llvm-toolchain-bookworm-22 main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update
          # (meson, bison, flex, mako and git: UAM, deko3d's shader compiler,
          # fetched and built into the program for the deko3d renderer -
          # without them the build leaves it out, and that renderer can
          # compile no shader on the console)
          apt-get install -y --no-install-recommends python3 ninja-build ccache clang-22 unzip curl zip gnupg \
            meson bison flex python3-mako git
          clang-22 --version | head -1
          ln -sf /usr/bin/clang-22 /usr/local/bin/clang

      - uses: actions/checkout@v4

      # The checkout is the runner's user's and the container runs as root,
      # so git refuses it after checkout's own step ("dubious ownership"):
      # the main menu's news (tools/embed_assets.py, the Build N commit's
      # message) came out empty
      - name: Let git read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-switch-${{ github.sha }}
          restore-keys: ccache-switch-

      # musl for the guest, which configure.py fetches
      - uses: actions/cache@v4
        with:
          path: build/android/third_party
          key: android-third-party-${{ hashFiles('tools/android_build.py') }}

      - name: Debug
        run: python3 tools/ci_build.py switch debug

      - name: Release
        run: python3 tools/ci_build.py switch release

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: halo-switch-debug
          path: dist/halo-switch-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: halo-switch-release
          path: dist/halo-switch-release
          retention-days: 3

  ps5:
    # The PS5 title (ninja ps5, port/ps5/README.md): the x32 guest and a host
    # built with PS5_Vulkan's toolchain, which is not this repository's and is
    # not copied into it. PS5_Vulkan, its payload SDK fork and PS5_Mesa are
    # cloned at the commits tools/ps5_build.py pins (read from it, so a pin
    # changes in one place) and set up by PS5_Vulkan's own scripts: the SDK
    # fork exported over the public SDK release, zlib, and RADV's release
    # archive built from PS5_Mesa (meson, LLVM 18 with libclc and the SPIR-V
    # translator for its OpenCL kernels, clang 22 for the console's code). The
    # set-up's results (.deps/native, 300 MB) and pacbrew's SDL2 (.deps/pacbrew,
    # 346 MB) are cached by their pins, so the Mesa build and the downloads are
    # paid once per pin. Clang 22 builds the guest and the host, clang 18 the
    # SDK's own parts (glslang, the platform layer), as on the build machine.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # (beside the checkout, as on the build machine; outside the
      # workspace, which the checkout cleans)
      PS5_DEPS: /home/runner/ps5-deps
    steps:
      - name: Install the toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git python3 python3-pip python3-pytest python3-mako python3-yaml \
            python3-packaging ninja-build cmake make pkg-config rsync wget unzip zip util-linux bison flex ccache \
            glslang-tools spirv-tools clang-18 lld-18 llvm-18-dev libclang-18-dev libclc-18 libclc-18-dev \
            libllvmspirvlib-18-dev llvm-spirv-18 libgl-dev libgles-dev zlib1g-dev libzstd-dev
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          sudo bash llvm.sh 22 && rm llvm.sh
          sudo apt-get install -y --no-install-recommends lld-22 llvm-22 libclang-rt-22-dev
          # (meson 1.4 or newer for Mesa; the distribution's is 1.3)
          sudo pip3 install --break-system-packages meson==1.12.1

      # Prove each tool the build calls is there, and name the missing one,
      # before an hour of building fails on it.
      - name: Check the toolchain
        run: |
          missing=0
          for tool in clang-22 llvm-config-22 ld.lld-22 llvm-ar-22 clang-18 clang++-18 ccache \
            /usr/lib/llvm-18/bin/llvm-config llvm-spirv-18 glslangValidator meson ninja cmake rsync wget unzip \
            flock bison flex; do
            if command -v "$tool" > /dev/null; then
              echo "found $tool: $(command -v "$tool")"
            else
              echo "::error::$tool is not installed; the PS5 build needs it"
              missing=1
            fi
          done
          for file in /usr/lib/llvm-22/lib/clang/22/lib/linux/libclang_rt.builtins-x86_64.a \
            /usr/include/GL/glcorearb.h /usr/include/GLES3/gl32.h; do
            if [ -f "$file" ]; then echo "found $file"; else echo "::error::$file is missing"; missing=1; fi
          done
          if ! ls /usr/lib/clc/*.bc > /dev/null 2>&1 && ! ls /usr/lib/llvm-18/lib/clc/*.bc > /dev/null 2>&1 \
            && ! ls /usr/share/clc/*.bc > /dev/null 2>&1; then
            echo "::error::libclc's bitcode is not installed (libclc-18)"
            missing=1
          fi
          meson --version
          clang-22 --version | head -1
          exit "$missing"

      - uses: actions/checkout@v4

      - name: Read the pins
        id: pins
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          from tools import ps5_build as pins
          print(f"vulkan={pins.PS5_VULKAN_COMMIT}")
          print(f"vulkan_url={pins.PS5_VULKAN_URL}")
          print(f"sdk={pins.PS5_PAYLOAD_SDK_REVISION}")
          print(f"sdk_url={pins.PS5_PAYLOAD_SDK_URL}")
          print(f"mesa={pins.PS5_MESA_COMMIT}")
          print(f"mesa_url={pins.PS5_MESA_URL}")
          print(f"pacbrew={pins.PACBREW_VERSION}-{pins.PACBREW_SHA256[:16]}")
          EOF
          cat "$GITHUB_OUTPUT"

      # (each fetched at its pin alone: the set-up exports that commit with
      # git archive, which a shallow fetch of it answers)
      - name: Clone the toolchain at its pins
        env:
          VULKAN: ${{ steps.pins.outputs.vulkan }}
          VULKAN_URL: ${{ steps.pins.outputs.vulkan_url }}
          SDK: ${{ steps.pins.outputs.sdk }}
          SDK_URL: ${{ steps.pins.outputs.sdk_url }}
          MESA: ${{ steps.pins.outputs.mesa }}
          MESA_URL: ${{ steps.pins.outputs.mesa_url }}
        run: |
          fetch() {
            git init -q "$PS5_DEPS/$1"
            git -C "$PS5_DEPS/$1" fetch -q --depth 1 "$2" "$3"
            git -C "$PS5_DEPS/$1" -c advice.detachedHead=false checkout -q FETCH_HEAD
            echo "$1 at $(git -C "$PS5_DEPS/$1" rev-parse HEAD)"
          }
          fetch PS5_Vulkan "$VULKAN_URL" "$VULKAN"
          fetch PS5_PayloadSDK "$SDK_URL" "$SDK"
          fetch PS5_Mesa "$MESA_URL" "$MESA"

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ps5-${{ github.sha }}
          restore-keys: ccache-ps5-

      - uses: actions/cache@v4
        with:
          path: ${{ env.PS5_DEPS }}/PS5_Vulkan/.deps/native
          key: ps5-native-${{ steps.pins.outputs.vulkan }}-${{ steps.pins.outputs.sdk }}-${{ steps.pins.outputs.mesa }}

      - uses: actions/cache@v4
        with:
          path: ${{ env.PS5_DEPS }}/PS5_Vulkan/.deps/pacbrew
          key: ps5-pacbrew-${{ steps.pins.outputs.pacbrew }}

      # musl, SDL3's headers and glslang, which configure.py fetches
      - uses: actions/cache@v4
        with:
          path: build/ps5/third_party
          key: ps5-third-party-${{ hashFiles('tools/android_build.py', 'tools/ps5_build.py', 'port/android/patches/**') }}

      # The tools on the path the way the build machine's hostdeps script puts
      # them (configure.py --ps5-hostdeps, PS5_HOSTDEPS): LLVM 18's first,
      # whose clang and libclc the native half of the Mesa build (mesa_clc and
      # vtn_bindgen2, PS5_Vulkan's tools/build-radv.sh) compiles OpenCL with,
      # against its SPIR-V translator. The console's half is clang 22's, which
      # the SDK's compiler wrapper takes from LLVM_CONFIG; but meson reads
      # LLVM_CONFIG too, as its llvm-config, so the native half would be
      # configured for LLVM 22, which has no SPIR-V translator here. The
      # script calls meson through MESON: a wrapper gives that one set-up
      # (the radv-clc-build folder) LLVM 18's llvm-config, as the build
      # machine's was set up, and passes everything else on as it is.
      - name: Set up the SDK fork and RADV
        run: |
          cat > "$PS5_DEPS/meson" <<EOF
          #!/bin/sh
          case " \$* " in
            *radv-clc-build*) export LLVM_CONFIG=/usr/lib/llvm-18/bin/llvm-config ;;
          esac
          exec $(command -v meson) "\$@"
          EOF
          cat "$PS5_DEPS/meson"
          chmod +x "$PS5_DEPS/meson"
          cat > "$PS5_DEPS/hostdeps.sh" <<EOF
          export PATH=/usr/lib/llvm-18/bin:\$PATH
          export MESON=$PS5_DEPS/meson
          EOF
          cat "$PS5_DEPS/hostdeps.sh"
          echo "PS5_HOSTDEPS=$PS5_DEPS/hostdeps.sh" >> "$GITHUB_ENV"
          echo "PS5_VULKAN=$PS5_DEPS/PS5_Vulkan" >> "$GITHUB_ENV"
          . "$PS5_DEPS/hostdeps.sh"
          bash "$PS5_DEPS/PS5_Vulkan/tools/setup-native-dependencies.sh"
          time env LLVM_CONFIG=/usr/bin/llvm-config-22 bash "$PS5_DEPS/PS5_Vulkan/tools/build-radv.sh" release
          cat "$PS5_DEPS/PS5_Vulkan/.deps/native/radv-release/PROVENANCE.txt"

      - name: Debug
        run: python3 tools/ci_build.py ps5 debug

      - name: Release
        run: python3 tools/ci_build.py ps5 release

      - name: Test
        run: python3 -m pytest -q tools/test_ps5_build.py tools/test_ps5_host.py

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: halo-ps5-debug
          path: dist/halo-ps5-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: halo-ps5-release
          path: dist/halo-ps5-release
          retention-days: 3

  release:
    # The six builds (Android's, the Switch's and the PS5's) as a release, tagged
    # build-<number> for a pushed tag v<number>, and marked latest
    # (every file keeps its name from release to release, for the README's
    # latest/download links); then all but the newest five build-* releases
    # go, tags and all. Only for a v<number> tag on a commit of main, newer
    # than the last release, and only when every platform built.
    needs: [android, switch, ps5]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag
        id: tag
        run: |
          version="$GITHUB_REF_NAME"
          case "$version" in
            v[0-9]*) number="${version#v}" ;;
            *) number= ;;
          esac
          if ! printf '%s' "$number" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::the tag $version is not v<number> (v94, say): no release"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tag $version is not on a commit of main: no release"
            exit 1
          fi
          if gh release view "build-$number" > /dev/null 2>&1; then
            echo "::error::build-$number is released already: tag a higher number"
            exit 1
          fi
          last="$(gh release list --limit 100 --json tagName \
            --jq '[.[] | .tagName | select(startswith("build-")) | ltrimstr("build-") | tonumber] | max // 0')"
          if [ "$number" -le "$last" ]; then
            echo "::error::the tag $version is not higher than the last release, build-$last: the installed builds would not update to it"
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: halo-*
          path: artifacts

      - name: Package
        run: |
          mkdir release
          for build in artifacts/*/; do
            name="$(basename "$build")"
            # the Switch's and the PS5's stored, not deflated: their updaters
            # (port/switch/host/host_update.c, in every build installed so
            # far, and port/ps5/host/host_update_ps5.c) unpack stored entries
            # only
            case "$name" in
              halo-switch*|halo-ps5*) level=-0 ;;
              *) level= ;;
            esac
            (cd "$build" && zip $level -qr "$GITHUB_WORKSPACE/release/$name.zip" .)
          done
          python3 tools/ci_build.py sums release
          ls -l release

      # SHA256SUMS signed with the release key's seed (the RELEASE_SIGNING_KEY
      # secret, 64 hex digits), and the signature checked against
      # deploy/release-key.pub before anything is published: a secret that is
      # not the key of the public key in the repository stops the release
      - name: Sign the sums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::warning::no RELEASE_SIGNING_KEY secret: the release's SHA256SUMS is not signed"
            exit 0
          fi
          sh tools/release_sign.sh sign release/SHA256SUMS
          sh tools/release_sign.sh verify release/SHA256SUMS

      - name: Publish
        id: publish
        env:
          NUMBER: ${{ steps.tag.outputs.number }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tag="build-$NUMBER"
          # the title: the commit's subject where it is "Build <number>: <title>"
          # (a release with a title of its own), else "Build <number>"
          subject="$(git log -1 --format=%s "$GITHUB_SHA")"
          case "$subject" in
            "Build $NUMBER: "*) title="$subject" ;;
            *) title="Build $NUMBER" ;;
          esac
          # the notes: the tagged commit's whole message, then where it came from
          git log -1 --format=%B "$GITHUB_SHA" > notes.md
          printf '\nCommit: %s\nBuild: %s\n\nThe release builds are for playing; the debug builds stop at the first failed assertion and log it.\n' \
            "$COMMIT_URL" "$RUN_URL" >> notes.md
          gh release create "$tag" release/*.zip --target "$GITHUB_SHA" --latest \
            --title "$title (${GITHUB_SHA:0:7})" --notes-file notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The Windows builds' executables and PDBs to Sentry, which turns the
      # crash reports of these builds (port/windows/src/win32_crash.c) into
      # backtraces with function names and lines. Needs the SENTRY_AUTH_TOKEN
      # secret: an organization auth token of the Sentry organization, which
      # names the organization and its region itself. The SENTRY_PROJECT
      # variable can name the project (its slug), else the id in the DSN of
      # win32_crash.c; SENTRY_ORG and SENTRY_URL (https://de.sentry.io) are
      # for a personal token instead. A failed upload does not stop the
      # release.
      - name: Upload Windows symbols to Sentry
        # (no Windows builds in this fork: see the top)
        if: false
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || '4512207917744208' }}
          ORG: ${{ vars.SENTRY_ORG }}
          URL: ${{ vars.SENTRY_URL }}
          SENTRY_CLI_VERSION: 2.46.0
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::no SENTRY_AUTH_TOKEN secret: crash reports of this build will have no function names"
            exit 0
          fi
          if [ -n "$ORG" ]; then export SENTRY_ORG="$ORG"; fi
          if [ -n "$URL" ]; then export SENTRY_URL="$URL"; fi
          curl -fsSL -o sentry-cli "https://github.com/getsentry/sentry-cli/releases/download/$SENTRY_CLI_VERSION/sentry-cli-Linux-x86_64"
          chmod +x sentry-cli
          ./sentry-cli debug-files upload --wait \
            artifacts/halo-windows-release artifacts/halo-windows-release-symbols \
            artifacts/halo-windows-debug artifacts/halo-windows-debug-symbols

      - name: Keep the last five
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --cleanup-tag --yes
          done

  pages:
    # The release's web build to GitHub Pages, which serves it at
    # https://halocombatevolved.com/ (port/web/README.md, "Hosting"). Only
    # main, only once every platform built and the release is out (the site
    # and the release are one build), and a deployment is never cancelled
    # halfway. The repository's Pages source must be GitHub Actions.
    # (not in this fork, which builds no web port: if: false)
    needs: [release]
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: halo-web-release
          path: site

      # The game's wasm, most of a build, from jsDelivr rather than GitHub
      # Pages, which serves 100 GB a month: the wasm alone in a commit of the
      # web-wasm branch (pushed over the last, so the repository keeps one),
      # which jsDelivr serves by its hash (with CORS; GitHub's release
      # downloads have none, so a page cannot fetch them), and version.json
      # names that copy and its SHA-256. The site's service worker takes the
      # wasm from there, checked, and from the site only when it cannot
      # (port/web/site/sw.js). A failure here leaves the site serving it.
      - name: The wasm on jsDelivr
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256="$(sha256sum site/halo.wasm | cut -d' ' -f1)"
          mkdir wasm
          cp site/halo.wasm wasm/
          cd wasm
          git init -q -b web-wasm
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            add halo.wasm
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "The web build's wasm (build $GITHUB_RUN_NUMBER, $GITHUB_SHA)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/web-wasm
          url="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@$(git rev-parse HEAD)/halo.wasm"
          # (jsDelivr fetches it now, and it must be the same file: it serves
          # files of at most 20 MB from GitHub)
          curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors -o served.wasm "$url"
          echo "$sha256  served.wasm" | sha256sum -c -
          cd ..
          python3 - "$url" "$sha256" <<'EOF'
          import json, sys
          with open("site/version.json") as file:
              stamp = json.load(file)
          stamp["wasm"] = {"url": sys.argv[1], "sha256": sys.argv[2]}
          with open("site/version.json", "w") as file:
              json.dump(stamp, file, indent=1)
          EOF
          echo "the wasm from $url"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

  notify:
    # A Discord embed for the run, to the DISCORD_WEBHOOK secret (nothing
    # without it): green when every platform built, red when one did not,
    # with each platform's result, this run's release (main only), and links
    # to the latest release's builds.
    needs: [android, switch, ps5, release]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ANDROID: ${{ needs.android.result }}
          SWITCH: ${{ needs.switch.result }}
          PS5: ${{ needs.ps5.result }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "no DISCORD_WEBHOOK secret: nothing to post"
            exit 0
          fi
          status() {
            case "$1" in
              success) echo "✅ Built" ;;
              failure) echo "❌ Failed" ;;
              cancelled) echo "⏹️ Cancelled" ;;
              *) echo "➖ Skipped" ;;
            esac
          }
          if [ "$ANDROID" = success ] && [ "$SWITCH" = success ] && [ "$PS5" = success ]; then
            title="Build succeeded"; color=5763719
          else
            title="Build failed"; color=15548997
          fi
          latest="$SERVER/$REPOSITORY/releases/latest"
          downloads="[Android]($latest/download/halo-android-release.zip) · [Switch]($latest/download/halo-switch-release.zip) · [PS5]($latest/download/halo-ps5-release.zip) ([all builds]($latest))"
          if [ -n "$RELEASE_TAG" ]; then
            release="[$RELEASE_TAG]($SERVER/$REPOSITORY/releases/tag/$RELEASE_TAG)"
            if [ "$PAGES" = success ]; then
              release="$release, on [the site]($SITE_URL)"
            fi
          else
            release="None (only a pushed v<number> tag makes one)"
          fi
          subject="$(printf '%s' "${MESSAGE:-manual run}" | head -n 1 | cut -c1-200)"
          jq -n \
            --arg title "$title" --argjson color "$color" --arg url "$RUN_URL" \
            --arg description "[\`${SHA:0:7}\`]($COMMIT_URL) $subject — $ACTOR ($BRANCH)" \
            --arg release "$release" --arg downloads "$downloads" \
            --arg android "$(status "$ANDROID")" \
            --arg switch "$(status "$SWITCH")" \
            --arg ps5 "$(status "$PS5")" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{embeds: [{
              title: $title, url: $url, color: $color, description: $description, timestamp: $timestamp,
              fields: [
                {name: "Android", value: $android, inline: true},
                {name: "Switch", value: $switch, inline: true},
                {name: "PS5", value: $ps5, inline: true},
                {name: "Release", value: $release},
                {name: "Latest release builds", value: $downloads}
              ]
            }]}' > payload.json
          # Discord rate limits webhooks (HTTP 429, with how many seconds to
          # wait in retry_after): wait and try again, a few times. A post
          # still limited, or a network or Discord error, is a warning rather
          # than a failed run; any other answer (a deleted webhook) fails. (At
          # most 5 tries of 15 seconds and 4 waits of 30: inside the job's 5
          # minutes.)
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS --max-time 15 -o response.json -w '%{http_code}' \
              -H "Content-Type: application/json" -d @payload.json "$WEBHOOK") || code=000
            case "$code" in
              2??)
                exit 0
                ;;
              429)
                wait=$(jq -r '.retry_after // 5' response.json 2>/dev/null || echo 5)
                wait=$(awk -v w="$wait" 'BEGIN { w += 0; if (w < 1) w = 1; if (w > 30) w = 30; printf "%d", w + 0.999 }')
                echo "Discord is rate limiting the webhook; trying again in ${wait}s (attempt $attempt of 5)"
                ;;
              000|5??)
                wait=5
                echo "Discord answered HTTP $code; trying again in ${wait}s (attempt $attempt of 5)"
                ;;
              *)
                echo "::error::Discord answered HTTP $code: $(cat response.json 2>/dev/null)"
                exit 1
                ;;
            esac
            [ "$attempt" -lt 5 ] && sleep "$wait"
          done
          echo "::warning::The Discord post did not go through after 5 attempts (HTTP $code)"
